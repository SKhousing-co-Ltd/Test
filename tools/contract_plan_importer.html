<!doctype html>
<html lang="ja">
<meta charset="utf-8"><title>契約書図面 初回登録確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17233a;font:14px system-ui,sans-serif}header{padding:16px 24px;background:#153b67;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.bar{display:flex;gap:12px;align-items:center;padding:12px 24px;background:#fff;flex-wrap:wrap}.bar select,button,input,textarea{padding:7px}.layout{display:grid;grid-template-columns:1fr 1fr 350px;gap:12px;padding:14px}.card{background:#fff;border:1px solid #dce4ee;border-radius:8px;padding:10px}.stage{position:relative;background:#eef2f6;min-height:400px;overflow:auto}.stage img{width:100%;display:block}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shape{fill:#1769aa33;stroke:#1769aa;stroke-width:.006}.shape.dim{fill:#e6922e22;stroke:#e6922e}.handle{position:absolute;width:12px;height:12px;background:#1769aa;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);cursor:move}.unit{border:1px solid #dce4ee;border-radius:6px;padding:8px;margin:8px 0}.unit.selected{border:2px solid #1769aa}.unit input,.unit textarea,.unit select{width:100%;margin:3px 0}.unit textarea{height:74px;font:11px monospace}.help{background:#edf5ff;border-radius:6px;padding:8px;font-size:12px;line-height:1.5}.status{font-size:12px;color:#4d6075}button{border:0;border-radius:5px;background:#2366a9;color:#fff;cursor:pointer}.muted{background:#728196}.login{background:#fff;color:#153b67}@media(max-width:1000px){.layout{grid-template-columns:1fr}}
</style>
<body>
<header><div><h1>契約書図面 初回登録確認</h1><small>契約書の平面図を確認し、既存システムのベース図へ区画を転記します。</small></div><button id="login" class="login">既存システムへログイン</button></header>
<div class="bar"><label>物件 <select id="building"></select></label><label>フロア <select id="floor"></select></label><label>契約書図面 <select id="plan"></select></label><button id="reload" class="muted">再読込</button><span id="auth" class="status">未ログイン（契約書確認は可能）</span></div>
<main class="layout"><section class="card"><h2>契約書から検出した平面図</h2><div id="source" class="stage"></div></section><section class="card"><h2>既存システムのベース平面図</h2><div id="white" class="stage"></div><p id="baseStatus" class="status">ログイン後、選択した物件・フロアのベース図を表示します。</p></section><aside class="card"><h2>確認・保存</h2><div class="help">「編集」で頂点をドラッグできます。「多角形を指定」を押して図面上を順にクリックし、「確定」で任意の多角形を作成します。保存するとローカル履歴に残り、承認済みだけが登録対象になります。</div><div id="meta"></div><div id="units"></div></aside></main>
<script>
let all=[],current,edit=-1,drag=null,draw=null,base=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const poly=a=>({type:'MultiPolygon',coordinates:[[[...a,a[0]]]]});
const points=g=>g?.coordinates?.[0]?.[0]?.slice(0,-1)||[];
function buildings(){return [...new Set(all.map(x=>x.property_name||'未設定'))]}
async function load(){let keep={b:current?.property_name,f:current?.floor_label,p:current?.id};all=await fetch('/api/candidates').then(r=>r.json());let bs=buildings();$('building').innerHTML=bs.map(x=>`<option>${esc(x)}</option>`).join('');if(keep.b&&bs.includes(keep.b))$('building').value=keep.b;$('building').onchange=()=>{floors();plans()};floors();if(keep.f&&[...$('floor').options].some(o=>o.value===keep.f))$('floor').value=keep.f;$('floor').onchange=plans;plans();if(keep.p&&[...$('plan').options].some(o=>o.value===keep.p)){$('plan').value=keep.p;await render()}}
function floors(){let b=$('building').value;let fs=[...new Set(all.filter(x=>x.property_name===b).map(x=>x.floor_label||'未分類'))];$('floor').innerHTML=fs.map(x=>`<option>${esc(x)}</option>`).join('')}
function plans(){let b=$('building').value,f=$('floor').value;let xs=all.filter(x=>x.property_name===b&&(x.floor_label||'未分類')===f);$('plan').innerHTML=xs.map(x=>`<option value="${x.id}">${esc(x.tenant_name||'未設定')} / p.${x.page_number}</option>`).join('');$('plan').onchange=()=>{edit=-1;draw=null;base=null;render()};render()}
function shapes(){let svg='<svg class="overlay" viewBox="0 0 1 1" preserveAspectRatio="none">',handles='';current.units.forEach((u,i)=>{let p=points(u.geometry);if(!p.length)return;svg+=`<polygon class="shape ${i===edit?'':'dim'}" points="${p.map(q=>q.join(',')).join(' ')}"/>`;if(i===edit)p.forEach((q,v)=>handles+=`<i class="handle" data-i="${i}" data-v="${v}" style="left:${q[0]*100}%;top:${q[1]*100}%"></i>`)});if(draw?.length)svg+=`<polyline class="shape" points="${draw.map(q=>q.join(',')).join(' ')}" fill="none"/>`;return svg+'</svg>'+handles}
async function loadBase(){if(!current)return;let r=await fetch('/api/base-plan?property_name='+encodeURIComponent(current.property_name)+'&floor_label='+encodeURIComponent(current.floor_label));if(!r.ok){base=null;$('baseStatus').textContent=r.status===401?'既存システムへログインするとベース図を取得できます。':'ベース図が見つかりません。';render();return}base=await r.json();render()}
async function login(){let email=prompt('既存システムのメールアドレス');if(!email)return;let password=prompt('パスワード');if(!password)return;let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok){alert(d.error||'ログインに失敗しました');return}$('auth').textContent='ログイン済み';await loadBase()}
async function render(){current=all.find(x=>x.id===$('plan').value);if(!current)return;$('source').innerHTML=`<img src="/assets/${current.source_preview_path}">`;let img=base?.preview_data||`/assets/${current.white_plan_path}`;$('white').innerHTML=`<img src="${img}">${shapes()}`;$('baseStatus').textContent=base?`ベース図: ${base.preview_file_path}`:'契約書図面の白図面候補を表示中';$('meta').innerHTML=`<p>物件: ${esc(current.property_name)}<br>フロア: ${esc(current.floor_label)}<br>テナント: ${esc(current.tenant_name)}<br>ページ: ${current.page_number}</p>`;$('units').innerHTML=current.units.map((u,i)=>`<form class="unit ${i===edit?'selected':''}"><b>区画候補 ${i+1}</b><button type="button" data-edit="${i}">編集</button><button type="button" data-draw="${i}">多角形を指定</button>${i===edit&&draw?.length>=3?'<button type="button" data-finish="1">多角形を確定</button>':''}<input name="code" value="${esc(u.unit_code||'')}" placeholder="区画番号"><textarea name="geo">${esc(u.geometry?JSON.stringify(u.geometry):'')}</textarea><select name="status"><option value="pending">未確認</option><option value="approved">承認</option><option value="needs_review">要確認</option><option value="rejected">却下</option></select><input name="reason" value="${esc(u.rejection_reason||'')}" placeholder="理由"><button>保存</button></form>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=+b.dataset.edit;draw=null;render()});document.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>{edit=+b.dataset.draw;draw=[];render()});let finish=document.querySelector('[data-finish]');if(finish)finish.onclick=()=>{current.units[edit].geometry=poly(draw);draw=null;render()};document.querySelectorAll('.unit').forEach((f,i)=>{f.status.value=current.units[i].status;f.onsubmit=async e=>{e.preventDefault();let d=new FormData(f),g;try{g=JSON.parse(d.get('geo'))}catch(_){alert('座標JSONを確認してください');return}await fetch('/api/unit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:current.units[i].id,status:d.get('status'),unit_code:d.get('code'),reason:d.get('reason'),geometry:g})});await load()}});document.querySelectorAll('.handle').forEach(h=>h.onpointerdown=e=>{drag={i:+h.dataset.i,v:+h.dataset.v};e.preventDefault()});$('white').onpointerdown=e=>{if(edit<0||!Array.isArray(draw)||drag)return;let r=$('white').getBoundingClientRect();draw.push([Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]);render()}}
window.onpointermove=e=>{if(!drag)return;let r=$('white').getBoundingClientRect(),p=[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))],a=points(current.units[drag.i].geometry);a[drag.v]=p;current.units[drag.i].geometry=poly(a);render()};window.onpointerup=()=>drag=null;$('reload').onclick=load;$('login').onclick=login;load();
</script></body></html>
